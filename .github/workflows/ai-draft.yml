# Owner-only: draft a report with AI and open an UNREVIEWED pull request. Never merges anything.
# Needs the repository secret NETRA_AI_KEY. Optional repository variables: NETRA_AI_PROVIDER, NETRA_AI_MODEL, NETRA_AI_BASE.
# Also needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: AI draft (unreviewed)

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path in the repo to a .txt, .md or .docx file (for example uploads/report.md)"
        required: true
      title:
        description: "Title of the report"
        required: true
      source:
        description: "Public https link to the report, or the publisher's name"
        required: true
      date:
        description: "Publication date, YYYY-MM-DD"
        required: true
      licence:
        description: "Licence of the report"
        required: true
        type: choice
        options: ["CC BY 4.0", "CC BY-SA 4.0", "Apache 2.0", "MIT", "Public domain", "Cite and summarise only", "Unknown"]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft with AI (key comes from a secret and is never written to the repo)
        env:
          NETRA_AI_KEY: ${{ secrets.NETRA_AI_KEY }}
          NETRA_AI_PROVIDER: ${{ vars.NETRA_AI_PROVIDER }}
          NETRA_AI_MODEL: ${{ vars.NETRA_AI_MODEL }}
          NETRA_AI_BASE: ${{ vars.NETRA_AI_BASE }}
          IN_FILE: ${{ inputs.file }}
          IN_TITLE: ${{ inputs.title }}
          IN_SOURCE: ${{ inputs.source }}
          IN_DATE: ${{ inputs.date }}
          IN_LICENCE: ${{ inputs.licence }}
        run: python3 scripts/ai_draft.py --file "$IN_FILE" --title "$IN_TITLE" --source "$IN_SOURCE" --date "$IN_DATE" --licence "$IN_LICENCE"
      - name: Check the build still passes
        run: python3 scripts/build.py --check
      - name: Open an unreviewed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TITLE: ${{ inputs.title }}
        run: |
          branch="ai-draft/${GITHUB_RUN_ID}"
          git config user.name "netra-ai-draft"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/drafts
          git commit -m "AI draft (unreviewed): $IN_TITLE"
          git push -u origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "AI draft (unreviewed): $IN_TITLE" \
            --body "AI-assisted draft produced by scripts/ai_draft.py. Unreviewed. Quotes were checked word for word against the source; non-matching quotes were removed and sentences that read as legal conclusions were redacted. A person must review it before anything is used. Not legal advice."
